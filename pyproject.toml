[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "isem-trader"
version = "0.1.0"
description = "Insider Signal Earnings Momentum trader for Interactive Brokers TWS"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31",
  "yfinance>=0.2.40",
  "ibapi>=9.81",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
isem-trader = "isem_trader.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
